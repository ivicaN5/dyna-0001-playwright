name: Visual Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  MARKET_BASE_URL_BE: ${{ secrets.MARKET_BASE_URL_BE }}
  MARKET_BASE_URL_NL: ${{ secrets.MARKET_BASE_URL_NL }}
  MARKET_BASE_URL_FR: ${{ secrets.MARKET_BASE_URL_FR }}
  MARKET_BASE_URL_CH: ${{ secrets.MARKET_BASE_URL_CH }}
  MARKET_BASE_URL_ES: ${{ secrets.MARKET_BASE_URL_ES }}

jobs:
  visual-tests:
    name: Visual Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run visual tests
        run: npx playwright test tests/visual
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-report
          path: playwright-report/
          retention-days: 30
