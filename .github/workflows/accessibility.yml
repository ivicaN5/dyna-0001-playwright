name: Accessibility Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  MARKET_BASE_URL_BE: ${{ secrets.MARKET_BASE_URL_BE }}
  MARKET_BASE_URL_NL: ${{ secrets.MARKET_BASE_URL_NL }}
  MARKET_BASE_URL_FR: ${{ secrets.MARKET_BASE_URL_FR }}
  MARKET_BASE_URL_CH: ${{ secrets.MARKET_BASE_URL_CH }}
  MARKET_BASE_URL_ES: ${{ secrets.MARKET_BASE_URL_ES }}

jobs:
  accessibility-tests:
    name: Accessibility Tests
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run accessibility tests
        # Accessibility findings are surfaced as a warning, not a hard failure:
        # the step may fail (violations found) without failing the workflow.
        continue-on-error: true
        # Parallelise to avoid the 60-min job-timeout cancellation: override the
        # repo-wide `workers: 1` (used only for visual-snapshot stability) and
        # skip retries, since results are reported as a warning either way.
        run: npx playwright test tests/accessibility --project=accessibility --project=accessibility-mobile --workers=4 --retries=0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 30
