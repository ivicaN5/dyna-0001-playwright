name: Update Visual Snapshots

# Run this manually from the GitHub Actions tab whenever you need to
# regenerate the Linux baseline screenshots (e.g. after adding new pages
# or after intentional UI changes).
on:
  workflow_dispatch:

env:
  MARKET_BASE_URL_BE: ${{ secrets.MARKET_BASE_URL_BE }}
  MARKET_BASE_URL_NL: ${{ secrets.MARKET_BASE_URL_NL }}
  MARKET_BASE_URL_FR: ${{ secrets.MARKET_BASE_URL_FR }}
  MARKET_BASE_URL_CH: ${{ secrets.MARKET_BASE_URL_CH }}
  MARKET_BASE_URL_ES: ${{ secrets.MARKET_BASE_URL_ES }}

jobs:
  update-snapshots:
    name: Update Linux Baseline Snapshots
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 1716 total snapshots split into 35 sequential shards of ~49 each.
      # Running shards one at a time (--workers=1) keeps memory usage low
      # and avoids browser crashes from too many parallel instances.
      - name: Update snapshots - shard 1/35
        run: npx playwright test tests/visual --update-snapshots --workers=1 --shard=1/35
      - name: Update snapshots - shard 2/35
        run: npx playwright test tests/visual --update-snapshots --workers=1 --shard=2/35
      - name: Update snapshots - shard 3/35
        run: npx playwright test tests/visual --update-snapshots --workers=1 --shard=3/35
      - name: Update snapshots - shard 4/35
        run: npx playwright test tests/visual --update-snapshots --workers=1 --shard=4/35
